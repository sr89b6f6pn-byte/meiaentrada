<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil Acadêmico</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#eef3fa;
}

.topo{
    background:#0057b8;
    color:white;
    padding:35px;
    text-align:center;
}

.topo h1{
    margin:0;
}

.card{
    width:90%;
    max-width:420px;
    margin:30px auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 6px 25px rgba(0,0,0,0.12);
}

.status{
    background:#e7f8ed;
    color:#16833d;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.foto{
    text-align:center;
    margin-top:25px;
}

.foto img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid #0057b8;
}

.info{
    padding:25px;
}

.info h2{
    margin-top:10px;
    color:#003f85;
}

.info p{
    font-size:17px;
    color:#444;
    margin:12px 0;
}

.footer{
    text-align:center;
    padding:20px;
    color:#777;
    font-size:14px;
}

</style>
</head>

<body>

<div class="topo">
<h1>Perfil Acadêmico</h1>
</div>

<div class="card">

<div class="status">
Perfil acadêmico confirmado
</div>

<img src="https://i.imgur.com/8Km9tLL.jpeg">
</div>

<p><strong>CPF/CIN:</strong> 438.222.558-23</p>

</div>

Documento acadêmico digital
</div>
